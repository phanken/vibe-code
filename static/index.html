<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groq Vibe Web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">G</span><div><b>Groq</b><small>Vibe Web</small></div></div>
    <button id="newProject" class="primary full">＋ Project mới</button>
    <div class="section-label">PROJECTS</div>
    <div id="projects" class="projects"></div>
    <div class="sidebar-foot"><span class="dot"></span><span id="providerStatus">Đang kiểm tra Groq…</span></div>
  </aside>

  <main class="chat-panel">
    <header>
      <div><h1 id="projectTitle">Chọn project</h1><p>Trò chuyện bình thường hoặc yêu cầu AI sửa project</p></div>
      <div class="header-actions">
        <button id="downloadProject" class="ghost" disabled>Tải ZIP</button>
        <button id="deleteProject" class="ghost danger" disabled>Xóa</button>
      </div>
    </header>
    <div id="messages" class="messages">
      <div class="empty"><div class="spark">✦</div><h2>Chat & vibe code</h2><p>Hỏi bất cứ điều gì hoặc nói “tạo/sửa/thêm…” để AI tự cập nhật project.</p></div>
    </div>
    <form id="chatForm" class="composer">
      <textarea id="prompt" placeholder="Nhắn với Groq hoặc yêu cầu tạo/sửa code..." rows="3" disabled></textarea>
      <div class="composer-bottom"><span id="status">Chưa chọn project</span><button class="primary" id="sendBtn" disabled>Gửi ↗</button></div>
    </form>
  </main>

  <section class="work-panel">
    <div class="tabs"><button class="tab active" data-tab="preview">Preview</button><button class="tab" data-tab="files">Files</button><button id="refreshPreview" class="icon-btn" title="Refresh">↻</button></div>
    <div id="previewTab" class="tab-content active"><iframe id="previewFrame" title="Preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
    <div id="filesTab" class="tab-content files-layout"><div id="fileList" class="file-list"></div><pre id="fileContent" class="file-content">Chọn một file để xem.</pre></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
