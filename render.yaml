services:
  - type: web
    name: gemini-vibe-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: AGENT_TIMEOUT
        value: "180"
      - key: MAX_PROJECT_CONTEXT
        value: "240000"
