services:
  - type: web
    name: groq-vibe-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-20b
      - key: GROQ_RETRIES_PER_MODEL
        value: "2"
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: "3800"
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: AGENT_TIMEOUT
        value: "180"
      - key: MAX_PROJECT_CONTEXT
        value: "8000"
